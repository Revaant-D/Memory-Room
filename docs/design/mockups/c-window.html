<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/switcher.css">
<script type="importmap">{"imports":{"three":"/static/viewer/vendor/three.module.min.js","three/addons/":"/static/viewer/vendor/"}}</script>
<style>
  :root {
    --wall: #8f867f;     /* the room's own wall, sampled from the scan */
    --wall-deep: #7c7165;
    --ink: #231d18;      /* the room's darkest colour */
    --ink-soft: #40362e;
    --paper: #efe9e2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--wall); color: var(--ink); font: 400 17px/1.45 Newsreader, Georgia, serif; font-optical-sizing: auto; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  /* The room only exists around the photo: it dissolves into the wall colour. */
  #stage { position: fixed; inset: 0; --r: 0%;
           -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 var(--r), transparent calc(var(--r) + 30%));
                   mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 var(--r), transparent calc(var(--r) + 30%)); }
  /* The photo itself: exactly where the room's view lines up with it */
  #photo { position: fixed; left: 50%; top: 50%; height: calc(100vh / var(--w, 1.75)); aspect-ratio: 294 / 518; transform: translate(-50%, -50%);
           object-fit: cover; opacity: 0; transition: opacity .5s; pointer-events: none; }
  #photo.on { opacity: 1; }
  .whole #stage { -webkit-mask-image: none; mask-image: none; }

  .layer { position: fixed; opacity: 0; pointer-events: none; transition: opacity .5s; }
  .layer.on { opacity: 1; pointer-events: auto; }

  /* Arrival: words under the window */
  #arrive { left: 0; right: 0; bottom: clamp(20px, 6vh, 56px); text-align: center; padding: 0 16px; }
  #arrive h1 { font-weight: 400; font-size: clamp(1.6rem, 3vw, 2.3rem); line-height: 1.1; margin: 0 0 16px; }
  .act { min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 1rem; }
  .act-quiet { min-height: 44px; padding: 0 12px; margin-left: 8px; text-decoration: underline; text-underline-offset: 4px; }

  /* Places: each place is the pile of its photos */
  #places { inset: 0; display: flex; align-items: center; justify-content: center; gap: clamp(28px, 6vw, 80px); flex-wrap: wrap; padding: 16px; }
  .pile { width: 168px; text-align: center; }
  .pile .stack { position: relative; width: 168px; height: 296px; display: block; margin-bottom: 16px; }
  .pile .stack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; box-shadow: 0 10px 30px rgba(35, 29, 24, .28);
                     transition: transform .35s ease; }
  .pile .stack img:nth-child(1) { transform: translate(10px, 8px); }
  .pile .stack img:nth-child(2) { transform: translate(5px, 4px); }
  .pile:hover .stack img:nth-child(1) { transform: translate(18px, 12px); }
  .pile:hover .stack img:nth-child(2) { transform: translate(9px, 6px); }
  .pile b { display: block; font-weight: 500; font-size: 1.35rem; line-height: 1.1; }
  .pile span { color: var(--ink-soft); font-size: .95rem; }
  .pile.empty .stack { border: 1.5px dashed rgba(35, 29, 24, .45); display: grid; place-items: center; color: var(--ink-soft); }

  /* At a photo */
  #top { top: 14px; left: 16px; display: flex; gap: 18px; align-items: center; }
  #top a, #top button { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); text-decoration: none; }
  #top .here { color: var(--ink); font-weight: 500; font-size: 1.15rem; }
  #top svg { width: 15px; height: 15px; }
  #caption { left: 0; right: 0; bottom: 92px; text-align: center; padding: 0 16px; }
  #caption .cap { font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 400; line-height: 1.1; display: block; }
  #caption .when { color: var(--ink-soft); font-size: .95rem; }

  /* The walk: one tick per photo, in the order the room was walked */
  #walk { left: 50%; bottom: 26px; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); height: 44px; }
  #walk .rail { position: absolute; left: 0; right: 0; top: 21px; height: 2px; background: rgba(35, 29, 24, .3); }
  #walk .you { position: absolute; top: 14px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--ink);
               transition: left .1s linear; }
  #walk button.tick { position: absolute; top: 0; width: 28px; height: 44px; margin-left: -14px; }
  #walk button.tick::after { content: ""; position: absolute; left: 13px; top: 14px; width: 2px; height: 16px; background: var(--ink); }
  #walk button.tick.waiting::after { left: 8px; top: 15px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: none; }
  #walk button.tick:hover::after { background: var(--paper); }

  #whole-toggle { right: 16px; top: 14px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(35, 29, 24, .45); }
  #whole-toggle:hover { background: rgba(35, 29, 24, .08); }
  .pin { position: fixed; left: 0; top: 0; width: 34px; height: 60px; margin: -30px 0 0 -17px; overflow: hidden; opacity: 0; pointer-events: none;
         box-shadow: 0 6px 16px rgba(35, 29, 24, .35); transition: opacity .4s, transform .1s linear; outline: 2px solid var(--paper); }
  .pin img { width: 100%; height: 100%; object-fit: cover; }
  .whole .pin { opacity: 1; pointer-events: auto; }
  #ask { top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 1.7rem; pointer-events: none !important; }
  .placing #stage { cursor: crosshair; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ink-soft); }
  @media (max-width: 600px) { #caption { bottom: 84px; } #top .here { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<img id="photo" alt="">
<p id="loading">Loading the room</p>

<section id="arrive" class="layer">
  <h1>Every photo, back in the room it was taken in.</h1>
  <button class="act" data-go="places">Sign up</button><button class="act-quiet" data-go="places">Log in</button>
</section>

<section id="places" class="layer">
  <button class="pile" id="pile-octave"><span class="stack" id="stack"></span><b>Octave Room</b><span>6 photos</span></button>
  <button class="pile empty"><span class="stack">Film a new place</span><b>&nbsp;</b><span>&nbsp;</span></button>
</section>

<header id="top" class="layer">
  <button data-go="places"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3 5 8l5 5"/></svg>Places</button>
  <span class="here">Octave Room</span>
</header>
<button id="whole-toggle" class="layer">See the whole room</button>
<section id="caption" class="layer" aria-live="polite"><span class="cap" id="cap"></span><span class="when" id="when"></span></section>
<nav id="walk" class="layer" aria-label="Photos in the order you walked the room"><span class="rail"></span><span class="you" id="you"></span></nav>
<p id="ask" class="layer">Where did you stand?</p>
<div id="pins"></div>

<nav class="mockup-switch" aria-label="Mockups"><a href="a-dollhouse.html">A</a><a href="b-plan.html">B</a><a aria-current="page" href="c-window.html">C</a></nav>

<script type="module">
import { createRoom, reduceMotion } from "./shared/room.js";

const $ = (id) => document.getElementById(id);
const room = await createRoom($("stage"), { pointSize: 0.022, tint: 0x8f867f });
window.mock = room;
// How much wider than the photo the view is: more room around it on a narrow screen.
const W = innerWidth < 600 ? 2.4 : 1.75;
const RMAX = innerWidth < 600 ? 70 : 45;
document.documentElement.style.setProperty("--w", W);
$("loading").remove();
const { box, uniforms: u, THREE, camera, controls } = room;
const [cx, cy] = box.centre;

// Photos in the order the room was walked (their frame number in the video).
const photos = [...room.photos].sort((a, b) => a.frame - b.frame);
let waiting = room.data.unplaced;
const path = room.data.path.map((p) => new THREE.Vector3(...p));
const lastFrame = path.length - 1;

const layers = [...document.querySelectorAll(".layer")];
const show = (...ids) => layers.forEach((el) => el.classList.toggle("on", ids.includes(el.id)));
const showImg = (p) => { $("photo").src = p.src; $("photo").alt = p.caption; $("photo").classList.add("on"); };
const setR = (v) => $("stage").style.setProperty("--r", v + "%");
const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

// ---- the walk rail -------------------------------------------------------------------
function buildWalk() {
  $("walk").querySelectorAll(".tick").forEach((t) => t.remove());
  for (const p of photos) {
    const b = document.createElement("button");
    b.className = "tick";
    b.style.left = (p.frame / lastFrame) * 100 + "%";
    b.setAttribute("aria-label", p.caption);
    b.onclick = () => walkTo(p);
    $("walk").append(b);
  }
  if (waiting) {
    const b = document.createElement("button");
    b.className = "tick waiting";
    b.style.left = "100%";
    b.setAttribute("aria-label", `${waiting.caption}, not placed yet`);
    b.onclick = startPlacing;
    $("walk").append(b);
  }
}
buildWalk();
$("stack").innerHTML = photos.slice(0, 3).reverse().map((p) => `<img src="${p.src}" alt="">`).join("");

// ---- moving: along the route walked while filming, not through walls ---------------------
let state = "arrive", at = null, frameAt = 0;
function walkTo(p) {
  if (state === "walking") return;
  const from = at;
  state = "walking";
  document.body.classList.remove("whole");
  show("top", "walk", "whole-toggle");
  if (from) $("photo").classList.remove("on");
  room.animate("tint", u.tintAmount, 0, 400);
  const view = room.viewFor(p, W);
  const a = from ? from.frame : frameAt, b = p.frame;
  const lo = Math.min(a, b), hi = Math.max(a, b);
  let route = path.slice(lo, hi + 1);
  if (a > b) route.reverse();
  route = [camera.position.clone(), ...route.slice(1, -1), view.position.clone()];
  const curve = route.length > 1 ? new THREE.CatmullRomCurve3(route) : null;
  const q0 = camera.quaternion.clone(), f0 = camera.fov;
  const duration = reduceMotion ? 0 : Math.min(3400, 900 + (curve ? curve.getLength() : 0) * 650);
  const start = performance.now();
  return new Promise((done) => {
    (function step(now) {
      const t = duration ? Math.min(1, Math.max(0, (now - start) / duration)) : 1, e = ease(t);
      if (curve) camera.position.copy(curve.getPoint(e));
      camera.quaternion.slerpQuaternions(q0, view.quaternion, e);
      camera.fov = f0 + (view.fov - f0) * e;
      frameAt = a + (b - a) * e;
      $("you").style.left = (frameAt / lastFrame) * 100 + "%";
      if (t < 1) return requestAnimationFrame(step);
      at = p; state = "photo";
      showImg(p);
      room.animate("tint", u.tintAmount, 0.3, 600);
      $("cap").textContent = p.caption;
      $("when").textContent = "18 November 2026";
      show("top", "walk", "whole-toggle", "caption");
      done();
    })(performance.now());
  });
}

function step(dir) {
  if (state !== "photo") return;
  const i = photos.indexOf(at);
  if (photos[i + dir]) walkTo(photos[i + dir]);
}

// ---- the whole room, for when you want to see it all, or place a photo --------------------
const pinEls = new Map();
function addPin(p) {
  const b = document.createElement("button");
  b.className = "pin";
  b.innerHTML = `<img src="${p.src}" alt="${p.caption}">`;
  b.onclick = () => walkTo(p);
  $("pins").append(b);
  pinEls.set(p.id, b);
}
photos.forEach(addPin);
room.onFrame(() => {
  for (const p of photos) {
    const s = room.project(p.position || p.spot);
    pinEls.get(p.id).style.transform = `translate(${s.x}px, ${s.y}px)`;
  }
});

async function whole() {
  state = "whole";
  $("photo").classList.remove("on");
  at = null;
  document.body.classList.add("whole");
  show("top", "walk");
  room.animate("tint", u.tintAmount, 0, 500);
  room.animate("cut", u.cut, 1.5, 900);
  await room.flyTo(room.view([cx + 0.3, cy - 3.4, 6.2], [cx, cy, 0.3], 50), 1600);
}
$("whole-toggle").onclick = whole;

async function startPlacing() {
  await whole();
  state = "placing";
  document.body.classList.add("placing");
  show("top", "walk", "ask");
}
$("stage").addEventListener("click", (e) => {
  if (state !== "placing") return;
  const hit = room.floorAt(e.clientX, e.clientY);
  if (!hit || hit.x < box.low[0] || hit.x > box.high[0] || hit.y < box.low[1] || hit.y > box.high[1]) return;
  const p = { ...waiting, frame: lastFrame, spot: new THREE.Vector3(hit.x, hit.y, 1.3) };
  waiting = null;
  photos.push(p);
  addPin(p);
  buildWalk();
  document.body.classList.remove("placing");
  state = "whole";
  show("top", "walk");
});

// ---- places and arrival ----------------------------------------------------------------
async function go(next) {
  if (next === "places") {
    state = "places";
    document.body.classList.remove("whole", "placing");
    $("photo").classList.remove("on");
    at = null;
    show("places");
    room.animate("opacity", u.opacity, 0, 500);
    const t0 = performance.now();
    (function close(now) { const t = Math.min(1, (now - t0) / 600); setR(RMAX * (1 - t)); if (t < 1) requestAnimationFrame(close); })(t0);
  }
}
// Opening a place: its newest photo opens out into the room it was taken in.
$("pile-octave").onclick = async () => {
  show();
  u.cut.value = 99;
  room.animate("opacity", u.opacity, 1, 600);
  const first = photos[0];
  room.jump(room.photoView(first, W));
  frameAt = first.frame; at = null;
  showImg(first);
  state = "photo"; at = first;
  open(first);
};
function open(p) {
  room.animate("tint", u.tintAmount, 0.3, 600);
  $("cap").textContent = p.caption;
  $("when").textContent = "18 November 2026";
  $("you").style.left = (p.frame / lastFrame) * 100 + "%";
  const t0 = performance.now();
  (function grow(now) { const t = reduceMotion ? 1 : Math.min(1, (now - t0) / 1600); setR(RMAX * ease(t)); if (t < 1) requestAnimationFrame(grow); })(t0);
  show("top", "walk", "whole-toggle", "caption");
}

document.addEventListener("click", (e) => { const t = e.target.closest("[data-go]"); if (t) go(t.dataset.go); });
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

// Arrival: one photo, then the room it was taken in opens out around it.
const hero = photos.find((p) => p.frame === 38) || photos[0];
room.jump(room.photoView(hero, W));
u.cut.value = 99; u.tintAmount.value = 0.3;
setR(0);
showImg(hero);
setTimeout(() => {
  const t0 = performance.now();
  (function grow(now) { const t = reduceMotion ? 1 : Math.min(1, (now - t0) / 2600); setR(RMAX * ease(t)); if (t < 1) requestAnimationFrame(grow); })(t0);
  show("arrive");
}, reduceMotion ? 0 : 700);
</script>
</body>
</html>
