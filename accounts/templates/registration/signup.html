{% extends "base.html" %}

{% block title %}Sign up · Memory Room{% endblock %}

{% block content %}
  <h1>Sign up</h1>
  <form method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <p class="actions"><button class="act" type="submit">Create account</button></p>
  </form>
  <p class="form-footer">Have an account? <a class="quiet" href="{% url 'login' %}">Log in</a></p>
{% endblock %}
