{% extends "base.html" %}

{% block title %}Sign up · Memory Room{% endblock %}

{% block content %}
  <h1>Sign up</h1>
  <form class="form" method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <button class="button" type="submit">Create account</button>
  </form>
  <p class="form-footer">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
