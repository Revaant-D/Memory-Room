{% extends "base.html" %}

{% block title %}Log in · Memory Room{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {# "next" is the page the person was trying to reach before being sent here. #}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "includes/form_fields.html" %}
    <p class="actions"><button class="act" type="submit">Log in</button></p>
  </form>
  <p class="form-footer">New here? <a class="quiet" href="{% url 'signup' %}">Sign up</a></p>
{% endblock %}
